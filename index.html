<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2e7d32">
    <link rel="manifest" href="./manifest.json">
    <title>Gerador de Carnês</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; padding-bottom: 160px; }
        header { background-color: #2e7d32; color: white; padding: 15px; text-align: center; font-weight: bold; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        
        .recibo-container { width: 100%; max-width: 850px; margin: 20px auto; padding: 10px; }
        
        /* Estilo do Carnê */
        .recibo { display: flex; border: 2px solid #333; background: #fff; margin-bottom: 15px; min-height: 180px; position: relative; }
        .lado-esquerdo { width: 40%; padding: 10px; border-right: 2px dashed #333; background: #fafafa; }
        .lado-direito { width: 60%; padding: 10px; }
        
        .campo { margin-bottom: 8px; }
        .campo label { display: block; font-size: 11px; font-weight: bold; color: #555; text-transform: uppercase; }
        .linha { border: none; border-bottom: 1px solid #333; width: 100%; font-family: monospace; font-size: 14px; font-weight: bold; background: transparent; padding: 2px 0; outline: none; }
        
        .titulo-recibo { text-align: center; border-bottom: 1px solid #333; margin-bottom: 10px; font-weight: 900; }

        /* Controles Fixos Embaixo */
        .botoes-fixos { position: fixed; bottom: 0; width: 100%; background: white; padding: 15px; box-shadow: 0 -3px 15px rgba(0,0,0,0.1); z-index: 900; }
        .linha-controles { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 15px; border: none; border-radius: 8px; font-weight: bold; color: white; cursor: pointer; text-transform: uppercase; font-size: 14px; }
        
        .btn-gerar { background: #1976d2; }
        .btn-limpar { background: #f57c00; flex: 0.5; }
        .btn-pdf { background: #2e7d32; width: 100%; display: block; }
        
        input[type="number"] { width: 70px; border-radius: 8px; border: 1px solid #ccc; text-align: center; font-size: 18px; }

        @media (max-width: 600px) {
            .recibo { flex-direction: column; border-bottom: 4px double #333; }
            .lado-esquerdo, .lado-direito { width: 100%; border-right: none; border-bottom: 2px dashed #333; }
        }
    </style>
</head>
<body>

<header>GERADOR DE CARNÊS PROFISSIONAL</header>

<div class="recibo-container" id="area-recibos">
    </div>

<div class="botoes-fixos">
    <div class="linha-controles">
        <input type="number" id="qtd" value="1" min="1" max="12">
        <button class="btn btn-gerar" onclick="gerarRecibos()">+ GERAR</button>
        <button class="btn btn-limpar" onclick="limpar()">LIMPAR</button>
    </div>
    <button class="btn btn-pdf" onclick="baixarPDF()">BAIXAR PDF</button>
</div>

<script>
    const area = document.getElementById('area-recibos');

    function gerarRecibos() {
        const quantidade = document.getElementById('qtd').value;
        const dataInicial = moment().format('YYYY-MM-DD');

        for (let i = 1; i <= quantidade; i++) {
            const id = Date.now() + i;
            const novaData = moment().add(i - 1, 'months').format('DD/MM/YYYY');
            
            const html = `
                <div class="recibo" id="bloco-${id}">
                    <div class="lado-esquerdo">
                        <div class="campo"><label>Parcela</label><input class="linha" value="${i}/${quantidade}"></div>
                        <div class="campo"><label>Vencimento</label><input class="linha" value="${novaData}"></div>
                        <div class="campo"><label>Valor R$</label><input class="linha" placeholder="0,00"></div>
                    </div>
                    <div class="lado-direito">
                        <div class="titulo-recibo">COMPROVANTE DE PAGAMENTO</div>
                        <div class="campo"><label>Pagador</label><input class="linha" type="text" placeholder="Nome Completo"></div>
                        <div class="campo"><label>Referente a</label><input class="linha" type="text" placeholder="Descrição do serviço"></div>
                        <div class="campo" style="display:flex; gap:10px;">
                            <div style="flex:1"><label>Data</label><input class="linha" value="${novaData}"></div>
                            <div style="flex:1"><label>Assinatura</label><div class="linha"></div></div>
                        </div>
                    </div>
                </div>
            `;
            area.insertAdjacentHTML('beforeend', html);
        }
        window.scrollTo(0, document.body.scrollHeight);
    }

    function limpar() {
        if(confirm("Limpar todos os recibos?")) area.innerHTML = "";
    }

    async function baixarPDF() {
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF('p', 'mm', 'a4');
        const elementos = document.querySelectorAll('.recibo');
        
        if (elementos.length === 0) return alert("Gere ao menos um recibo primeiro!");

        for (let i = 0; i < elementos.length; i++) {
            const canvas = await html2canvas(elementos[i], { scale: 2 });
            const imgData = canvas.toDataURL('image/png');
            
            // Adiciona 3 recibos por página
            const yPos = (i % 3) * 90 + 10; 
            if (i > 0 && i % 3 === 0) pdf.addPage();
            
            pdf.addImage(imgData, 'PNG', 10, yPos, 190, 80);
        }
        
        pdf.save(`carnes_${moment().format('DD-MM')}.pdf`);
    }

    // Registro do Service Worker para PWA
    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js');
    }
</script>

</body>
</html>
</html>
